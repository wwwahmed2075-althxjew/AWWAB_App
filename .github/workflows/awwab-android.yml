name: Miladh Android APK
concurrency:
  group: awwab-android-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ["main", "feature/**"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.awwab .
      - name: Set Android application display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          import re
          text, count = re.subn(r'android:label="[^"]*"', 'android:label="ملاذ"', text, count=1)
          if count == 0:
              text = text.replace('<application', '<application\\n        android:label="ملاذ"', 1)
          manifest.write_text(text)
          PY
      - name: Configure Android permissions and notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.VIBRATE',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in text:
                  text = text.replace('<application', f'    {tag}\n    <application', 1)
          manifest.write_text(text)
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              if 'isCoreLibraryDesugaringEnabled = true' not in g:
                  g = re.sub(r'compileOptions \{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', g, count=1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              gradle.write_text(g)
          PY
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Miladh-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Build optimized release APK
        run: flutter build apk --release --no-pub
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Miladh-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
