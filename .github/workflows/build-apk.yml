name: Build Malaz Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install packages
        run: flutter pub get
      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.awwab
      - name: Set Arabic application label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r'android:label="[^"]*"', 'android:label="ملاذ"', s, count=1)
          if n != 1:
              raise SystemExit("Could not set the Android application label")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Build optimized release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Malaz-Android-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
