name: Build Mishkat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "README.md"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Madinah manifest has exactly 604 page hashes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/mushaf/madinah_hafs_v4_manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          hashes = data.get("gitBlobSha1", {})
          expected = {str(i) for i in range(1, 605)}
          if data.get("pageCount") != 604 or set(hashes) != expected:
              raise SystemExit("Madinah manifest must contain exactly pages 1..604")
          if any(not isinstance(v, str) or len(v) != 40 for v in hashes.values()):
              raise SystemExit("Invalid SHA-1 entry in Madinah manifest")
          print("Manifest structure OK: 604 page hashes")
          PY
      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.mishkat
      - name: Ensure Gradle plugin repositories are configured
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/settings.gradle.kts")
          content = p.read_text(encoding="utf-8")
          match = re.search(r'pluginManagement\s*\{', content)
          if not match:
              raise SystemExit("pluginManagement block not found in generated settings.gradle.kts")
          start = match.end()
          repos = re.search(r'repositories\s*\{', content[start:])
          if not repos:
              raise SystemExit("pluginManagement repositories block not found")
          insert_at = start + repos.end()
          block_end = content.find("}", insert_at)
          if block_end < 0:
              raise SystemExit("Could not locate plugin repositories block end")
          block = content[insert_at:block_end]
          additions = []
          if not re.search(r'(?m)^\s*google\(\)', block):
              additions.append("        google()")
          if not re.search(r'(?m)^\s*mavenCentral\(\)', block):
              additions.append("        mavenCentral()")
          if additions:
              content = content[:insert_at] + "\n" + "\n".join(additions) + content[insert_at:]
              p.write_text(content, encoding="utf-8")
          print("Gradle plugin repositories include Google Maven Central and Plugin Portal")
          PY
      - name: Set Arabic app label and stable package id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          content, count = re.subn(r'android:label="[^"]*"', 'android:label="مشكاة"', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Arabic app label")
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace('<application', permission + '\\n    <application', 1)
          receiver = '''
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in content:
              content = content.replace('</application>', receiver + '\\n</application>', 1)
          manifest.write_text(content, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              content = gradle.read_text(encoding="utf-8")
              content = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.mishkat.app"', content)
              gradle.write_text(content, encoding="utf-8")
          else:
              gradle = Path("android/app/build.gradle")
              if gradle.exists():
                  content = gradle.read_text(encoding="utf-8")
                  content = re.sub(r'applicationId "[^"]+"', 'applicationId "com.mishkat.app"', content)
                  gradle.write_text(content, encoding="utf-8")
          PY
      - name: Align Kotlin JVM target with Java 11
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle.kts")
          content = p.read_text(encoding="utf-8")
          marker = "tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>()"
          if marker not in content:
              content += '''

          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  kotlinOptions.jvmTarget = "11"
              }
          }
          '''
              p.write_text(content, encoding="utf-8")
          print("All Kotlin compile tasks now target JVM 11 to match Java")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icons from approved artwork
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and widget tests
        run: flutter test
      - name: Build one optimized APK for Samsung A16 (ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Mishkat.apk
      - name: Report APK size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/app/outputs/flutter-apk/Mishkat.apk")
          if not p.is_file():
              raise SystemExit("Mishkat.apk was not generated")
          print(f"{p.name}: {p.stat().st_size / 1024 / 1024:.2f} MiB")
          PY
      - name: Upload single release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mishkat-Android-APK
          path: build/app/outputs/flutter-apk/Mishkat.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download for browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view malaz-latest >/dev/null 2>&1; then
            gh release upload malaz-latest build/app/outputs/flutter-apk/Mishkat.apk --clobber
          else
            gh release create malaz-latest build/app/outputs/flutter-apk/Mishkat.apk \\
              --title "مشكاة - أحدث نسخة" \\
              --notes "ملف APK مباشر لتطبيق مشكاة (ARM64)."
          fi
