name: Build Malaz Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "README.md"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Madinah manifest has exactly 604 page hashes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/mushaf/madinah_hafs_v4_manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          hashes = data.get("gitBlobSha1", {})
          expected = {str(i) for i in range(1, 605)}
          if data.get("pageCount") != 604 or set(hashes) != expected:
              raise SystemExit("Madinah manifest must contain exactly pages 1..604")
          if any(not isinstance(v, str) or len(v) != 40 for v in hashes.values()):
              raise SystemExit("Invalid SHA-1 entry in Madinah manifest")
          print("Manifest structure OK: 604 page hashes")
          PY
      - name: Download and verify all 604 Madinah pages, then bundle them offline
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path("assets/mushaf/madinah_hafs_v4_manifest.json").read_text(encoding="utf-8"))
          hashes = manifest["gitBlobSha1"]
          commit = manifest["commit"]
          output = Path("assets/mushaf/offline")
          output.mkdir(parents=True, exist_ok=True)

          def fetch(page):
              name = f"{page:03d}.svg"
              url = f"https://raw.githubusercontent.com/quran-ws/quran-svg/{commit}/mushafs/hafs/kfqc/svg/{name}"
              request = urllib.request.Request(url, headers={"User-Agent": "Malaz-Offline-Mushaf-Builder"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              git_blob = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if git_blob != hashes[str(page)]:
                  raise RuntimeError(f"SHA-1 mismatch for Madinah page {page}")
              if b"<svg" not in data[:500]:
                  raise RuntimeError(f"Invalid SVG page {page}")
              return page, data

          pages = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for page, data in pool.map(fetch, range(1, 605)):
                  pages[page] = data
          if len(pages) != 604:
              raise RuntimeError(f"Expected 604 verified pages, got {len(pages)}")

          total = 0
          for start in range(1, 605, 60):
              end = min(start + 59, 604)
              archive_path = output / f"pages_{start:03d}_{end:03d}.zip"
              with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  for page in range(start, end + 1):
                      archive.writestr(f"{page:03d}.svg", pages[page])
              total += archive_path.stat().st_size
              print(f"Created {archive_path.name}: {archive_path.stat().st_size / 1024 / 1024:.2f} MiB")
          print(f"Verified and bundled all 604 pages. Compressed bundles: {total / 1024 / 1024:.2f} MiB")
          PY
      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.malaz
      - name: Set Arabic app label and stable package id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          content, count = re.subn(r'android:label="[^"]*"', 'android:label="ملاذ"', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Arabic app label")
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace('<application', permission + '\\n    <application', 1)
          manifest.write_text(content, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              content = gradle.read_text(encoding="utf-8")
              content = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.malaz.app"', content)
              gradle.write_text(content, encoding="utf-8")
          else:
              gradle = Path("android/app/build.gradle")
              if gradle.exists():
                  content = gradle.read_text(encoding="utf-8")
                  content = re.sub(r'applicationId "[^"]+"', 'applicationId "com.malaz.app"', content)
                  gradle.write_text(content, encoding="utf-8")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icons from approved artwork
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and widget tests
        run: flutter test
      - name: Build optimized split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Report APK sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path("build/app/outputs/flutter-apk").glob("*.apk")):
              print(f"{p.name}: {p.stat().st_size / 1024 / 1024:.2f} MiB")
          PY
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Malaz-Android-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
