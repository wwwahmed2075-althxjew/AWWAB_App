name: Build Malaz Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "README.md"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Madinah manifest has exactly 604 page hashes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/mushaf/madinah_hafs_v4_manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          hashes = data.get("gitBlobSha1", {})
          expected = {str(i) for i in range(1, 605)}
          if data.get("pageCount") != 604 or set(hashes) != expected:
              raise SystemExit("Madinah manifest must contain exactly pages 1..604")
          if any(not isinstance(v, str) or len(v) != 40 for v in hashes.values()):
              raise SystemExit("Invalid SHA-1 entry in Madinah manifest")
          print("Manifest structure OK: 604 page hashes")
          PY
      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.malaz
      - name: Set Arabic app label and stable package id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text(encoding="utf-8")
          s, n = re.subn(r'android:label="[^"]*"', 'android:label="ملاذ"', s, count=1)
          if n != 1:
              raise SystemExit("Could not set Arabic app label")
          manifest.write_text(s, encoding="utf-8")
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              s = gradle.read_text(encoding="utf-8")
              s = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.malaz.app"', s)
              s = re.sub(r'namespace = "[^"]+"', 'namespace = "com.malaz.app"', s)
              gradle.write_text(s, encoding="utf-8")
          else:
              gradle = Path("android/app/build.gradle")
              if gradle.exists():
                  s = gradle.read_text(encoding="utf-8")
                  s = re.sub(r'applicationId "[^"]+"', 'applicationId "com.malaz.app"', s)
                  s = re.sub(r'namespace "[^"]+"', 'namespace "com.malaz.app"', s)
                  gradle.write_text(s, encoding="utf-8")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icons from approved artwork
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build optimized split APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Report APK sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path("build/app/outputs/flutter-apk").glob("*.apk")):
              print(f"{p.name}: {p.stat().st_size / 1024 / 1024:.2f} MiB")
          PY
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Malaz-Android-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
