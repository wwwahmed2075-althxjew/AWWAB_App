name: malaz
description: تطبيق ملاذ الإسلامي
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.4
  crypto: ^3.0.6
  archive: ^3.6.1
  geolocator: ^13.0.2
  adhan: ^2.0.0
  flutter_compass: ^0.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/mushaf/madinah_hafs_v4_manifest.json
    - assets/mushaf/offline/
    - assets/branding/malaz_icon.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/malaz_icon.jpg
  adaptive_icon_background: '#050505'
  adaptive_icon_foreground: assets/branding/malaz_icon.jpg
  min_sdk_android: 21

